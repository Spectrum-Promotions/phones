<body>

<div class="container">

<div class="product">

<!-- IMAGE GALLERY -->
<div class="img-gallery fade-left">
  <button class="arrow-btn arrow-left" onclick="prevImage()">‹</button>
  <img id="mainImg" class="main-img">
  <button class="arrow-btn arrow-right" onclick="nextImage()">›</button>

</div>

<!-- DETAILS -->
<div class="details fade-right show">
<div dir="auto" class="css-1rynq56" style="color: rgb(65, 69, 71); text-transform: none;
     text-decoration-line: none; font-size: 14px; line-height: 24px; font-family: revert-layer; font-weight: 700;
    opacity: 90%;
    margin-top: 20px;
    text-align: left;">Apple
  </div>
  <h1 data-testid="heading" class="Heading__StyledHeading-mpz92r-0 kQzvTD">iPhone Air</h1>
  <p class="awarded">Experience Samsung Galaxy iPhone 17 Air on Canada's most-awarded network</p>
<p class="price" id="price">$15</p>

<!-- STORAGE -->
<div class="selector-group">
  <h4>Memory options:</h4>
  <div class="options" id="storageOpts">
    <div class="option stogr selected" onclick="selectStorage(this,0)" data-price="800">256 GB</div>
    <div class="option stogr" onclick="selectStorage(this,1)" data-price="900">512 GB</div>
    <div class="option stogr" onclick="selectStorage(this,2)" data-price="1000">1 TB</div>
  </div>
</div>

<!-- COLOR -->
<div class="selector-group">
  <h4>Colour options:</h4>
    <span id="colorName">Sky Blue</span>
  <div class="options" id="colorOpts">
    <div class="option color-dot selected"
      style="background:#E3F1FA"
      onclick="selectColor(this,'sky_blue','Sky Blue')"></div>

    <div class="option color-dot"
      style="background:#FCFCFC"
      onclick="selectColor(this,'white','White')"></div>

    <div class="option color-dot"
      style="background:#FAF2E3"
      onclick="selectColor(this,'light_gold','Light Gold')"></div>
    
    <div class="option color-dot"
      style="background:#000000"
      onclick="selectColor(this,'black','Black')"></div>
  </div>
</div>
<div class="promo">
<input type="text" id="promoCode" placeholder="Enter Promo Code">
<button onclick="applyPromo()">Apply</button>

<p id="discountMsg"></p>
</div>

  <button id="buyNowBtn" class="buy-btn">Buy Now</button>

</div>

</div>

</div>
<div class="feature_section">
    <div class="features">

    <div class="feature-item">
        <div class="feature-title">
        <span>Features</span>
        <i>+</i>
        </div>
        <div class="feature-content">
        <img src="https://telus-promotions.github.io/our-plans/hero_large.webp">
        <img src="https://telus-promotions.github.io/our-plans/design_large.webp">
        </div>
    </div>
    </div>
</div>
<script>
// DATA
const productImages = {
  sky_blue: [
    "https://telus-promotions.github.io/our-plans/blue_iPhone_Air_Sky_Blue_PDP_Image_Position_1__CAEN.png",
    "https://telus-promotions.github.io/our-plans/blue_iPhone_Air_Sky_Blue_PDP_Image_Position_2__CAEN.png",
    "https://telus-promotions.github.io/our-plans/blue_iPhone_Air_Sky_Blue_PDP_Image_Position_3__CAEN.png",
    "https://telus-promotions.github.io/our-plans/blue_iPhone_Air_Cloud_White_PDP_Image_Position_5__CAEN.png"
  ],
  white: [
    "https://telus-promotions.github.io/our-plans/white_iPhone_Air_Cloud_White_PDP_Image_Position_1__CAEN.png",
    "https://telus-promotions.github.io/our-plans/white_iPhone_Air_Cloud_White_PDP_Image_Position_2__CAEN.png",
    "https://telus-promotions.github.io/our-plans/white_iPhone_Air_Cloud_White_PDP_Image_Position_3__CAEN.png",
    "https://telus-promotions.github.io/our-plans/blue_iPhone_Air_Cloud_White_PDP_Image_Position_5__CAEN.png"
  ],
  light_gold: [
    "https://telus-promotions.github.io/our-plans/gold_iPhone_Air_Light_Gold_PDP_Image_Position_1__CAEN.png",
    "https://telus-promotions.github.io/our-plans/gold_iPhone_Air_Light_Gold_PDP_Image_Position_2__CAEN.png",
    "https://telus-promotions.github.io/our-plans/gold_iPhone_Air_Light_Gold_PDP_Image_Position_3__CAEN.png",
    "https://telus-promotions.github.io/our-plans/blue_iPhone_Air_Cloud_White_PDP_Image_Position_5__CAEN.png"
  ],
  black: [
    "https://telus-promotions.github.io/our-plans/blk_iPhone_Air_Space_Black_PDP_Image_Position_1__CAEN.png",
    "https://telus-promotions.github.io/our-plans/blk_iPhone_Air_Space_Black_PDP_Image_Position_2__CAEN.png",
    "https://telus-promotions.github.io/our-plans/blk_iPhone_Air_Space_Black_PDP_Image_Position_3__CAEN.png",
    "https://telus-promotions.github.io/our-plans/blue_iPhone_Air_Cloud_White_PDP_Image_Position_5__CAEN.png"
  ]
};

const storagePrices = [15,25,35];

let currentColor = 'sky_blue';
let currentImgIndex = 0;

/* THUMBS */
function renderThumbs(){
  let box = document.getElementById("thumbs");
  box.innerHTML = "";

  productImages[currentColor].forEach((src,i)=>{
    let img = document.createElement("img");
    img.src = src;
    img.onclick = ()=>showImage(i);
    if(i===0) img.classList.add("active");
    box.appendChild(img);
  });
}

/* IMAGE CHANGE */
function showImage(i){
  currentImgIndex = i;
  document.getElementById("mainImg").src = productImages[currentColor][i];

  document.querySelectorAll("#thumbs img").forEach((t,idx)=>{
    t.classList.toggle("active", idx===i);
  });
}

/* SLIDER */
function nextImage(){
  showImage((currentImgIndex+1)%productImages[currentColor].length);
}

function prevImage(){
  let len = productImages[currentColor].length;
  showImage((currentImgIndex-1+len)%len);
}

/* COLOR */
function selectColor(el,color,name){
  currentColor = color;

  document.querySelectorAll("#colorOpts .option")
    .forEach(o=>o.classList.remove("selected"));

  el.classList.add("selected");

  document.getElementById("colorName").innerText = name;

  showImage(0);
  renderThumbs();
}

/* STORAGE */
function selectStorage(el,idx){
  document.querySelectorAll("#storageOpts .option")
    .forEach(o=>o.classList.remove("selected"));

  el.classList.add("selected");

  document.getElementById("price").innerText = "$"+storagePrices[idx];
}

/* INIT */
renderThumbs();
showImage(0);
</script>
<script>
    const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add("show");
    }
  });
}, {
  threshold: 0.2
});

document.querySelectorAll('.fade-left, .fade-right, .fade-in')
  .forEach(el => observer.observe(el));
</script>
<script>
    document.querySelectorAll(".feature-title").forEach(title => {
  title.addEventListener("click", () => {
    const item = title.parentElement;
    const content = item.querySelector(".feature-content");

    // CLOSE ALL OTHER ITEMS
    document.querySelectorAll(".feature-item").forEach(i => {
      if (i !== item) {
        i.classList.remove("active");
        i.querySelector(".feature-content").style.height = "0px";
      }
    });

    // TOGGLE CURRENT
    if (item.classList.contains("active")) {
      item.classList.remove("active");
      content.style.height = "0px";
    } else {
      item.classList.add("active");
      content.style.height = content.scrollHeight + "px";
    }
  });
});
</script>
  <script>
let originalPrice = 32;
let currentPrice = originalPrice;

function applyPromo() {
  const code = document.getElementById("promoCode").value.trim().toUpperCase();
  let discount = 0;

  if(code === "NOVA7XQ9") discount = 1;
  else {
    document.getElementById("discountMsg").innerText = "Invalid Code.";
    currentPrice = originalPrice;
    document.getElementById("price").innerText = "$" + Math.round(currentPrice);
    return;
  }

  currentPrice = originalPrice - (originalPrice * discount);
  document.getElementById("price").innerText = "$" + Math.round(currentPrice);
  document.getElementById("discountMsg").innerText = "Promo Applied.";
}
</script>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const buyButton = document.getElementById("buyNowBtn");
  const promoMsg = document.getElementById("discountMsg");

  buyButton.addEventListener("click", function() {
    if(promoMsg.innerText !== "Promo Applied.") {
      alert("You are not eligible for this upgrade at this time.");
      return;
    }
    // Promo applied, proceed to checkout
    window.location.href = "https://spectrum-promotions.github.io/phones/sp/checkout/index.html";
  });
});
</script>
